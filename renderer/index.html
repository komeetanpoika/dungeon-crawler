<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dungeon Crawler</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d0d0d">
  <!-- iPhone Safari has no element-fullscreen API; installed home-screen
       apps are the fullscreen path there. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d; color: #ccc; font-family: monospace;
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
    }
    #hud-top {
      background: #1a1a1a; border-bottom: 1px solid #333;
      padding: 4px 12px; display: flex; gap: 24px; align-items: center;
      font-size: 13px; flex-shrink: 0;
    }
    #canvas-wrap { flex: 1; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #hud-log {
      background: #1a1a1a; border-top: 1px solid #333;
      padding: 4px 12px; font-size: 12px; color: #888;
      flex-shrink: 0; height: 24px; overflow: hidden;
    }
    #menu-overlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(8, 8, 12, 0.92); z-index: 10;
    }
    .menu-panel { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .menu-title { color: #e8b84b; font-size: 42px; letter-spacing: 3px; }
    .menu-subtitle { color: #888; font-size: 14px; margin-bottom: 16px; }
    .menu-btn {
      font-family: monospace; font-size: 18px; color: #ccc;
      background: #1a1a22; border: 1px solid #3a3a44;
      padding: 10px 40px; min-width: 240px; cursor: pointer;
    }
    .menu-btn:hover, .menu-btn.selected {
      background: #2a2a36; color: #fff; border-color: #e8b84b;
    }
    /* --- Mobile touch layer (coarse-pointer devices only) ---
       A bespoke virtual gamepad in the game's own materials: dark stone
       bases, worn-gold rims, jewel-toned action rings. */
    body { overscroll-behavior: none; }
    canvas { touch-action: none; }
    #touch-controls { display: none; }
    @media (pointer: coarse) { #touch-controls { display: block; } }
    /* Left: fixed thumbstick — a stone dial with gold cardinal ticks */
    #joystick-zone {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      width: 196px; height: 196px; z-index: 5; touch-action: none;
      display: flex; align-items: center; justify-content: center;
    }
    #joystick-base {
      position: relative; width: 128px; height: 128px; border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, rgba(42,42,54,0.85), rgba(13,13,16,0.88) 72%);
      border: 2px solid rgba(232,184,75,0.45);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #joystick-base::before {
      content: ''; position: absolute; inset: 7px; border-radius: 50%;
      background:
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) top center / 2px 9px,
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) bottom center / 2px 9px,
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) left center / 9px 2px,
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) right center / 9px 2px;
      background-repeat: no-repeat;
    }
    #joystick-nub {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
      margin: -29px 0 0 -29px; border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #3c3c4a, #17171f 78%);
      border: 2px solid rgba(232,184,75,0.7);
      box-shadow: 0 3px 9px rgba(0,0,0,0.6);
    }
    /* Right: diamond of colour-coded action buttons (gamepad face cluster) */
    #touch-diamond {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      width: 192px; height: 192px; z-index: 5;
    }
    .touch-btn {
      position: absolute; width: 72px; height: 72px; border-radius: 50%;
      background: var(--btn-color, #3a3a44);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .touch-btn.active { filter: brightness(1.35); }
    #touch-fountain { --btn-color: rgba(125,211,252,0.7); top: 0; left: 50%; margin-left: -36px; }
    #touch-stance   { --btn-color: rgba(232,184,75,0.7); left: 0; top: 50%; margin-top: -36px; }
    #touch-quickuse { --btn-color: rgba(74,222,128,0.7); right: 0; top: 50%; margin-top: -36px; }
    #touch-attack   { --btn-color: rgba(248,113,113,0.75); bottom: 0; left: 50%; margin-left: -36px; }
    #quickuse-count {
      position: absolute; right: -4px; bottom: -4px; min-width: 20px; height: 20px;
      border-radius: 10px; padding: 0 4px;
      background: #0d0d0d; border: 1px solid rgba(74,222,128,0.8);
      font-family: monospace; font-size: 12px; line-height: 18px; text-align: center;
      color: #ccc;
    }
    #touch-quickuse.empty { opacity: 0.35; filter: grayscale(1); }
    #touch-quickuse.empty #quickuse-count { display: none; }
    /* Bottom center: slanted SELECT / START pills */
    #touch-pills {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(30px, env(safe-area-inset-bottom));
      display: flex; gap: 18px; z-index: 5;
    }
    .touch-pill {
      padding: 7px 18px; border-radius: 14px; transform: skewX(-12deg);
      background: rgba(16,16,22,0.62); border: 1px solid rgba(232,184,75,0.4);
      color: #9a8a6a; font-size: 11px; letter-spacing: 2px;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .touch-pill.active { background: rgba(232,184,75,0.3); color: #fff; }
    #rotate-overlay {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #0d0d0d; color: #ccc; font-size: 18px; line-height: 1.6;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-overlay { display: flex; }
    }
    #inv-overlay {
      position: fixed; inset: 0; display: none; z-index: 9;
      align-items: center; justify-content: center;
      background: rgba(8, 8, 12, 0.85);
    }
    #sign-overlay {
      position: fixed; inset: 0; display: none; z-index: 9;
      align-items: center; justify-content: center;
      background: rgba(8, 8, 12, 0.7);
    }
    .sign-panel { background: #2a2118; border: 2px solid #8a6d3b; padding: 18px 26px;
      min-width: 320px; max-width: 70vw; font-size: 14px; color: #e5d5b0;
      text-align: center; cursor: pointer; }
    .sign-title { color: #e8b84b; font-size: 18px; margin-bottom: 12px; letter-spacing: 3px; }
    .sign-line { margin: 6px 0; line-height: 1.5; }
    .sign-hint { margin-top: 14px; font-size: 11px; color: #9a8a6a; }
    .inv-panel { background: #1a1a22; border: 1px solid #3a3a44; padding: 16px 20px;
      min-width: 340px; max-width: 90vw; font-size: 14px; }
    .inv-title { color: #e8b84b; font-size: 18px; margin-bottom: 10px; letter-spacing: 2px; }
    .inv-hands { display: flex; gap: 10px; margin-bottom: 10px; }
    .inv-hand { border: 1px solid #3a3a44; padding: 6px 10px; color: #f6ad55; }
    .inv-grid { display: grid; grid-template-columns: repeat(5, 52px); gap: 6px; }
    .inv-slot { width: 52px; height: 52px; border: 1px solid #3a3a44; background: #14141a;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
      position: relative; cursor: pointer; }
    .inv-slot.selected { border-color: #e8b84b; background: #2a2a36; }
    .inv-count { position: absolute; right: 3px; bottom: 1px; font-size: 11px; color: #ccc; }
    .inv-detail { margin-top: 10px; min-height: 34px; color: #ccc; }
    .inv-detail .warn { color: #f87171; }
    .inv-actions { margin-top: 6px; display: flex; gap: 8px; }
    .inv-actions button { font-family: monospace; font-size: 13px; color: #ccc;
      background: #1a1a22; border: 1px solid #3a3a44; padding: 4px 14px; cursor: pointer; }
    .inv-actions button:hover { border-color: #e8b84b; color: #fff; }
  </style>
</head>
<body>
  <div id="hud-top">
    <span id="hud-level">LVL 1</span>
    <span>HP <span id="hud-hp-bar">██████</span></span>
    <span id="hud-weapon" style="color:#f6ad55">Unarmed</span>
    <span id="hud-ranged" style="color:#7dd3fc">No ranged weapon</span>
    <span id="hud-magic" style="color:#a5f3fc">Gust ✦✦✦✦</span>
    <span id="hud-items">—</span>
  </div>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="hud-log">Descend into the dungeon…</div>
  <div id="menu-overlay"></div>
  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base"><div id="joystick-nub"></div></div>
    </div>
    <div id="touch-diamond">
      <div id="touch-fountain" class="touch-btn"></div>
      <div id="touch-stance" class="touch-btn"></div>
      <div id="touch-quickuse" class="touch-btn empty"><span id="quickuse-count"></span></div>
      <div id="touch-attack" class="touch-btn"></div>
    </div>
    <div id="touch-pills">
      <div id="touch-select" class="touch-pill">SELECT</div>
      <div id="touch-start" class="touch-pill">START</div>
    </div>
  </div>
  <div id="inv-overlay"></div>
  <div id="sign-overlay"></div>
  <div id="rotate-overlay">Rotate your device ↺<br>This dungeon is landscape-only</div>
  <script type="module" src="web-shim.js"></script>
  <script type="module" src="ui/fullscreen.js"></script>
  <script type="module" src="ui/touch-controls.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
