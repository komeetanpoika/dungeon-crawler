<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dungeon Crawler</title>
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Without this the browser falls back to requesting /favicon.ico, which
       nothing serves — a 404 on every page load. The manifest icons cover
       installed apps, not the browser tab. -->
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <meta name="theme-color" content="#0d0d0d">
  <!-- iPhone Safari has no element-fullscreen API; installed home-screen
       apps are the fullscreen path there. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d; color: #ccc; font-family: monospace;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    #canvas-wrap { position: fixed; inset: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #hud-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
    #hud-status {
      position: absolute;
      left: max(12px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      display: flex; flex-direction: column; gap: 6px;
    }
    #hud-hearts { display: flex; gap: 3px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9)); }
    #hud-hearts .heart { image-rendering: pixelated; }
    /* Blue pixel-framed stamina bar: stepped 8-bit border + 25% ticks */
    #hud-stamina {
      width: 140px; height: 12px; position: relative;
      background: rgba(13,13,16,0.75);
      border: 2px solid #2a2a36; outline: 2px solid rgba(13,13,16,0.9);
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    #hud-stamina-fill {
      display: block; height: 100%; width: 100%;
      background: #7dd3fc; transition: width 0.1s linear;
    }
    #hud-stamina::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(#2a2a36, #2a2a36) 25% 0 / 2px 100%,
        linear-gradient(#2a2a36, #2a2a36) 50% 0 / 2px 100%,
        linear-gradient(#2a2a36, #2a2a36) 75% 0 / 2px 100%;
      background-repeat: no-repeat;
    }
    #hud-stamina[data-refused="1"] { border-color: #f87171; }
    #hud-stamina[data-refused="1"] #hud-stamina-fill { background: #f87171; }
    #hud-offhand {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      top: max(10px, env(safe-area-inset-top));
      display: flex; align-items: flex-end; gap: 2px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
    }
    /* Tool slot: follows the stance (quiver in ranged, wand in magic), stacked under the offhand */
    #hud-ammo {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      top: calc(max(10px, env(safe-area-inset-top)) + 56px);
      display: flex; align-items: flex-end; gap: 2px;
      opacity: 0.6; transition: opacity 0.15s;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
    }
    #hud-ammo[hidden] { display: none; }
    #hud-ammo[data-active="1"] { opacity: 1; }
    .hud-icon { width: 48px; height: 48px; image-rendering: pixelated; }
    .hud-icon-empty { opacity: 0.3; filter: grayscale(1); }
    .hud-count { font-size: 13px; color: #ccc; font-family: monospace; }
    #menu-overlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(8, 8, 12, 0.92); z-index: 10;
    }
    .menu-panel { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .menu-title { color: #e8b84b; font-size: 42px; letter-spacing: 3px; }
    .menu-subtitle { color: #888; font-size: 14px; margin-bottom: 16px; }
    .menu-btn {
      font-family: monospace; font-size: 18px; color: #ccc;
      background: #1a1a22; border: 1px solid #3a3a44;
      padding: 10px 40px; min-width: 240px; cursor: pointer;
    }
    .menu-btn:hover, .menu-btn.selected {
      background: #2a2a36; color: #fff; border-color: #e8b84b;
    }
    /* a long list (Controls): tighter rows, and it scrolls on a low window */
    .menu-panel.compact { gap: 5px; max-height: 96vh; overflow-y: auto; padding: 0 12px; }
    .menu-panel.compact .menu-title { font-size: 28px; }
    .menu-panel.compact .menu-subtitle { margin-bottom: 6px; }
    .menu-panel.compact .menu-btn { font-size: 15px; padding: 5px 24px; min-width: 340px; text-align: left; white-space: pre; }
    .menu-btn.done { color: #7fd18a; border-color: #3f6b48; }
    .menu-hint { display: block; font-size: 12px; color: #9a9aa6; margin-top: 3px; }
    .menu-btn.done:hover, .menu-btn.done.selected { color: #b8f0c0; border-color: #7fd18a; }
    .menu-input {
      font: 18px monospace; padding: 6px 10px; margin: 8px 0; width: 12em;
      text-align: center; background: #111; color: #eee; border: 1px solid #555;
    }
    /* --- Mobile touch layer (coarse-pointer devices only) ---
       A bespoke virtual gamepad in the game's own materials: dark stone
       bases, worn-gold rims, jewel-toned action rings. */
    body { overscroll-behavior: none; }
    canvas { touch-action: none; }
    #touch-controls { display: none; position: relative; z-index: 15; }
    @media (pointer: coarse) { #touch-controls { display: block; } }
    /* A menu text field is up (menu.js): the touch layer steps aside so a
       tap reaches the field and brings up the phone keyboard. */
    body.menu-typing #touch-controls { display: none; }
    /* Left: fixed thumbstick — a stone dial with gold cardinal ticks */
    #joystick-zone {
      position: fixed;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      width: 196px; height: 196px; z-index: 5; touch-action: none;
      display: flex; align-items: center; justify-content: center;
    }
    #joystick-base {
      position: relative; width: 128px; height: 128px; border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, rgba(42,42,54,0.85), rgba(13,13,16,0.88) 72%);
      border: 2px solid rgba(232,184,75,0.45);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #joystick-base::before {
      content: ''; position: absolute; inset: 7px; border-radius: 50%;
      background:
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) top center / 2px 9px,
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) bottom center / 2px 9px,
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) left center / 9px 2px,
        linear-gradient(rgba(232,184,75,0.55), rgba(232,184,75,0.55)) right center / 9px 2px;
      background-repeat: no-repeat;
    }
    #joystick-nub {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px;
      margin: -29px 0 0 -29px; border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #3c3c4a, #17171f 78%);
      border: 2px solid rgba(232,184,75,0.7);
      box-shadow: 0 3px 9px rgba(0,0,0,0.6);
    }
    /* Right: diamond of colour-coded action buttons (gamepad face cluster) */
    #touch-diamond {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      width: 192px; height: 192px; z-index: 5;
    }
    .touch-btn {
      position: absolute; width: 72px; height: 72px; border-radius: 50%;
      background: var(--btn-color, #3a3a44);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .touch-btn.active { filter: brightness(1.35); }
    #touch-fountain { --btn-color: rgba(125,211,252,0.7); top: 0; left: 50%; margin-left: -36px; }
    #touch-stance   { --btn-color: rgba(232,184,75,0.7); bottom: 0; left: 50%; margin-left: -36px; }
    #touch-quickuse { --btn-color: rgba(74,222,128,0.7); right: 0; top: 50%; margin-top: -36px; }
    #touch-attack   { --btn-color: rgba(248,113,113,0.75); left: 0; top: 50%; margin-top: -36px; }
    #touch-quickuse.empty { opacity: 0.35; filter: grayscale(1); }
    /* An online or local PvP match: the offhand slot always holds something
       usable (shield/blink), so the empty-offhand greying (meant for
       adventure/dungeon play, where the sack can be genuinely empty) must
       not apply. */
    body.net-match #touch-quickuse.empty { opacity: 1; filter: none; }
    /* in the bag and on the map the green button has a job of its own */
    body.pad-panel #touch-quickuse.empty { opacity: 1; filter: none; }
    /* Bag, map and menu: three icons at the top, beside the offhand badge
       that holds the corner itself. */
    #touch-icons {
      position: fixed; top: max(10px, env(safe-area-inset-top));
      right: calc(max(14px, env(safe-area-inset-right)) + 62px);
      display: flex; gap: 10px; z-index: 5;
    }
    /* A menu overlay is up (menu.js): the icons must not take a tap meant
       for the menu. */
    body.menu-open #touch-icons { display: none; }
    /* an online match has no bag and no map */
    body.net-match #touch-bag, body.net-match #touch-map { display: none; }
    .touch-icon {
      width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(16,16,22,0.62); border: 1px solid rgba(232,184,75,0.45);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .touch-icon svg { width: 26px; height: 26px; fill: none; stroke: #e8b84b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .touch-icon.active { background: rgba(232,184,75,0.3); }
    #rotate-overlay {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: #0d0d0d; color: #ccc; font-size: 18px; line-height: 1.6;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-overlay { display: flex; }
    }
    /* The bag (ui/inventory-panel.js): gear, bag and button labels side by
       side with a keyboard; on a phone the gear stands above the stick, the
       labels above the buttons and the bag takes the middle. */
    #inv-overlay {
      position: fixed; inset: 0; display: none; z-index: 9;
      align-items: flex-start; justify-content: center; gap: 14px;
      padding-top: 12vh; box-sizing: border-box;
      background: rgba(8, 8, 12, 0.88); font-family: monospace;
    }
    /* The corner minimap (render/minimap.js); the offhand and tool badges
       move over to make room for it. */
    #minimap {
      position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top));
      width: 160px; height: 160px; image-rendering: pixelated; box-sizing: content-box;
      border: 2px solid rgba(232,184,75,0.55); background: #12141a; box-shadow: 0 2px 8px rgba(0,0,0,0.7); opacity: 0.93;
    }
    #minimap[hidden] { display: none; }
    body.has-minimap #hud-offhand, body.has-minimap #hud-ammo { right: calc(max(14px, env(safe-area-inset-right)) + 178px); }
    /* The full map (ui/map-panel.js) */
    #map-overlay { position: fixed; inset: 0; display: none; z-index: 9; background: #12141a; font-family: monospace; }
    #map-overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: grab; }
    #map-overlay .inv-what { position: absolute; right: 16px; top: 16px; padding: 10px 12px; width: 270px; box-sizing: border-box; white-space: nowrap; background: rgba(16,16,22,0.82); border: 1px solid #3a3a44; }
    @media (pointer: coarse) {
      #map-overlay.touch .inv-what { right: max(14px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 54px);
        width: 192px; box-sizing: border-box; gap: 10px 4px; font-size: 12px; background: rgba(16,16,22,0.6); border: 0; padding: 6px; }
    }
    #sign-overlay {
      position: fixed; inset: 0; display: none; z-index: 9;
      align-items: center; justify-content: center;
      background: rgba(8, 8, 12, 0.7);
    }
    #toast-overlay {
      position: fixed; inset: 0; display: none; z-index: 9;
      align-items: center; justify-content: center;
      background: rgba(8, 8, 12, 0.7);
    }
    .sign-panel { background: #2a2118; border: 2px solid #8a6d3b; padding: 18px 26px;
      min-width: 320px; max-width: 70vw; font-size: 14px; color: #e5d5b0;
      text-align: center; cursor: pointer; }
    .sign-title { color: #e8b84b; font-size: 18px; margin-bottom: 12px; letter-spacing: 3px; }
    .sign-line { margin: 6px 0; line-height: 1.5; }
    .sign-hint { margin-top: 14px; font-size: 11px; color: #9a8a6a; }
    .inv-gear, .inv-bag { background: #1a1a22; border: 1px solid #3a3a44; padding: 10px 12px; box-sizing: border-box; }
    .inv-gear { width: 236px; }
    .inv-who { display: flex; align-items: center; gap: 10px; color: #f6ad55; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    .inv-who img { width: 48px; height: 48px; image-rendering: pixelated; }
    .inv-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 6px; justify-items: center; }
    .inv-slot-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .inv-slot-wrap small { font-size: 10px; color: #9a927f; }
    .inv-tile, .inv-slot { width: 46px; height: 46px; border: 1px solid #3a3a44; background: #14141a; position: relative;
      display: flex; align-items: center; justify-content: center; box-sizing: border-box; cursor: pointer; }
    .inv-tile.selected, .inv-slot.selected { border: 2px solid #e8b84b; background: #2a2a36; }
    .inv-tile.spare { border-style: dashed; opacity: 0.45; cursor: default; }
    .inv-bag { width: 452px; position: relative; display: flex; flex-direction: column; gap: 8px; }
    .inv-title { color: #e8b84b; font-size: 14px; letter-spacing: 2px; }
    .inv-grid { display: grid; grid-template-columns: repeat(8, 46px); gap: 6px; }
    .inv-icon { width: 36px; height: 36px; image-rendering: pixelated; pointer-events: none; }
    .inv-emoji { font-size: 22px; }
    .inv-count { position: absolute; right: 2px; bottom: 0; font-size: 11px; color: #ccc; }
    .inv-desc { border-top: 1px solid #3a3a44; padding-top: 8px; min-height: 84px; color: #ccc; font-size: 13px; line-height: 1.5; }
    .inv-desc b { display: block; color: #e8b84b; letter-spacing: 2px; text-transform: uppercase; min-height: 1.5em; }
    .inv-desc .warn { color: #f87171; }
    .inv-chooser { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); background: #22222c; border: 2px solid #e8b84b;
      padding: 6px 4px; font-size: 14px; color: #ccc; box-shadow: 0 6px 20px #000; z-index: 1; }
    .inv-chooser div { padding: 4px 14px 4px 26px; cursor: pointer; position: relative; }
    .inv-chooser .selected { color: #e8b84b; }
    .inv-chooser .selected::before { content: '▸'; position: absolute; left: 10px; }
    /* the four labels, laid out like the buttons: blue over red and green over yellow */
    .inv-what { width: 200px; display: grid; grid-template: auto auto auto auto / 1fr 1fr; gap: 14px 6px; font-size: 13px; color: #eee; align-items: center; padding-top: 6px; }
    .inv-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; position: relative; }
    .inv-btn b { width: 16px; height: 16px; border-radius: 50%; flex: none; }
    .inv-btn em { font-style: normal; }
    .inv-btn kbd, .inv-close kbd { font-family: monospace; font-size: 11px; color: #9a927f; border: 1px solid #3a3a44; padding: 0 4px; margin-left: 2px; }
    .inv-btn.red b { background: rgb(248,113,113); } .inv-btn.green b { background: rgb(74,222,128); }
    .inv-btn.blue b { background: rgb(125,211,252); } .inv-btn.yellow b { background: rgb(232,184,75); }
    .inv-btn.blue, .inv-btn.yellow { grid-column: 1 / 3; justify-content: center; }
    .inv-btn.green { justify-content: flex-end; flex-direction: row-reverse; }
    .inv-btn.green em { order: 1; }   /* reads "Use [Q] ●", the dot nearest its button */
    .inv-btn.off { opacity: 0.3; cursor: default; }
    /* Drop is held: the label fills while the hold runs */
    .inv-btn.blue::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: -5px; height: 3px; background: rgb(125,211,252); transform: scaleX(0); transform-origin: left; }
    .inv-btn.blue.holding::after { transform: scaleX(1); transition: transform 0.5s linear; }
    .inv-close { grid-column: 1 / 3; justify-self: center; color: #9a927f; cursor: pointer; margin-top: 10px; }
    @media (pointer: coarse) {
      #inv-overlay.touch { display: block; padding: 0; }
      #inv-overlay.touch .inv-gear { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); width: 196px; padding: 8px; }
      #inv-overlay.touch .inv-who { margin-bottom: 6px; font-size: 14px; }
      #inv-overlay.touch .inv-who img { width: 36px; height: 36px; }
      #inv-overlay.touch .inv-tile { width: 40px; height: 40px; }
      #inv-overlay.touch .inv-tile .inv-icon, #inv-overlay.touch .inv-slot .inv-icon { width: 32px; height: 32px; }
      #inv-overlay.touch .inv-bag { position: absolute; top: max(8px, env(safe-area-inset-top)); bottom: max(8px, env(safe-area-inset-bottom));
        left: calc(max(10px, env(safe-area-inset-left)) + 204px); right: calc(max(14px, env(safe-area-inset-right)) + 218px); width: auto; }   /* clear of the buttons and the three icons */
      #inv-overlay.touch .inv-grid { grid-template-columns: repeat(auto-fill, 42px); gap: 5px; overflow-y: auto; flex: none; max-height: 60%; }
      #inv-overlay.touch .inv-slot { width: 42px; height: 42px; }
      #inv-overlay.touch .inv-desc { flex: 1; min-height: 0; overflow: hidden; }
      #inv-overlay.touch .inv-what { position: absolute; right: max(14px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 54px);
        width: 192px; gap: 10px 4px; padding: 0; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="menu-overlay"></div>
  <div id="hud-overlay">
    <canvas id="minimap" hidden></canvas>
    <div id="hud-status">
      <span id="hud-hearts"></span>
      <span id="hud-stamina"><span id="hud-stamina-fill"></span></span>
    </div>
    <div id="hud-offhand"></div>
    <div id="hud-ammo" hidden></div>
  </div>
  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base"><div id="joystick-nub"></div></div>
    </div>
    <div id="touch-diamond">
      <div id="touch-fountain" class="touch-btn"></div>
      <div id="touch-stance" class="touch-btn"></div>
      <div id="touch-quickuse" class="touch-btn empty"></div>
      <div id="touch-attack" class="touch-btn"></div>
    </div>
    <div id="touch-icons">
      <div id="touch-bag" class="touch-icon" aria-label="Bag"><svg viewBox="0 0 24 24"><path d="M6 9h12l1.5 11h-15z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg></div>
      <div id="touch-map" class="touch-icon" aria-label="Map"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></div>
      <div id="touch-menu" class="touch-icon" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    </div>
  </div>
  <div id="inv-overlay"></div>
  <div id="map-overlay"></div>
  <div id="sign-overlay"></div>
  <div id="toast-overlay"></div>
  <div id="rotate-overlay">Rotate your device ↺<br>This dungeon is landscape-only</div>
  <script type="module" src="web-shim.js"></script>
  <script type="module" src="ui/fullscreen.js"></script>
  <script type="module" src="ui/touch-controls.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
