name: tests

# Direct pushes to main, and every pull request. Deliberately not every push
# on every branch: a PR branch would otherwise run the suite twice per push.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run's answer irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report both versions rather than hiding one behind the other's failure.
      fail-fast: false
      matrix:
        # Kept as a matrix with one entry on purpose: it keeps the check name
        # "test (22)" stable for main's branch protection, and adding a version
        # later is a one-line change rather than a rename that silently stops
        # the required check from ever reporting.
        #
        # 18 was dropped once local development moved to 22: it went EOL in
        # April 2025, and `node --test test/` never worked on anything newer,
        # so nothing was being developed against it any more.
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts skips Electron's ~100 MB binary download. The suite is
      # pure node:test over the renderer modules — it imports nothing but node:
      # builtins and never launches the app — so the binary is dead weight here.
      - run: npm ci --ignore-scripts
      - run: npm test
