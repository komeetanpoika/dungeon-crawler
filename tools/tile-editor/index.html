<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tile Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #16161e; color: #ccc; font: 13px/1.4 monospace; height: 100vh;
         display: flex; flex-direction: column; padding: 10px; gap: 8px; }
  header { display: flex; gap: 8px; align-items: center; background: #0d0d14;
           padding: 6px 10px; border-radius: 4px; }
  button, select, input { font: inherit; color: #ccc; background: #1a1a24;
           border: 1px solid #333; border-radius: 3px; padding: 3px 10px; cursor: pointer; }
  button.active { background: #3a3a55; color: #fff; }
  button.save { background: #226633; color: #fff; margin-left: auto; }
  button.on { background: #254438; color: #7fd; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  main { flex: 1; display: flex; gap: 10px; min-height: 0; }
  .panel { background: #0d0d14; border-radius: 4px; padding: 8px; }
  .label { color: #888; font-size: 11px; text-transform: uppercase; margin: 6px 0 3px; }
  /* Group heading: one per SET of controls, replacing the old heading-per-control. */
  .grp { color: #8a8a98; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
         border-bottom: 1px solid #2a2a36; padding-bottom: 3px; margin: 11px 0 6px;
         display: flex; justify-content: space-between; align-items: baseline; }
  .panel > .grp:first-child { margin-top: 0; }
  /* Heading that shows a verbatim identifier (a tag name) — never case-folded. */
  .grp.ident { text-transform: none; letter-spacing: 0; }
  /* Inline row: label and control share a line. */
  .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .rlab { color: #8a8a98; font-size: 11px; flex: 0 0 52px; text-align: right; white-space: nowrap; }
  /* Indent under a .row's label column, so a hint lines up with its control. */
  .rind { margin-left: 58px; }
  /* A number field in an inline row: the default 10px side padding plus the
     spinner reservation leaves ~9px of usable width at these sizes. Also
     applies to the Rules tab's weight field, which trades its spinner for
     ~25px more room to show the number. */
  .row input[type=number] { padding: 3px 4px; }
  .row input[type=number]::-webkit-inner-spin-button { appearance: none; margin: 0; }
  .cap { color: #777; font-size: 10px; margin-top: 2px; }
  .thumb { width: 22px; height: 22px; image-rendering: pixelated; border: 1px solid #333;
           border-radius: 2px; flex: 0 0 auto; }
  .x { color: #966; cursor: pointer; font-size: 11px; }
  .x:hover { color: #e88; }
  .assign-banner { color: #7fd; font-size: 11px; margin-bottom: 4px; }
  #library-mode { color: #7fd; font-size: 11px; }
  #library.picking { outline: 1px dashed #7fd6; outline-offset: 2px; }
  #library.picking img { cursor: crosshair; }
  #library.picking img:hover { border-color: #7fd; box-shadow: 0 0 0 2px #7fd3; }
  #toolbar { width: 96px; display: flex; flex-direction: column; gap: 6px; }
  #toolbar button { width: 100%; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  #pixel-canvas { image-rendering: pixelated; border: 1px solid #444;
                  background:
                    repeating-conic-gradient(#1c1c26 0 25%, #14141c 0 50%) 0 0 / 16px 16px; }
  #sidebar { width: 200px; display: flex; flex-direction: column; overflow-y: auto; }
  #sidebar canvas { image-rendering: pixelated; border: 1px solid #444; display: block; }
  #palette { display: grid; grid-template-columns: repeat(8, 20px); gap: 2px; }
  #palette .swatch { width: 20px; height: 20px; border: 1px solid #333; cursor: pointer; }
  #palette .swatch.active { border: 1px solid #fff; }
  #library-bar { height: 96px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  #library { display: flex; gap: 4px; overflow-x: auto; flex: 1; align-items: center; }
  #library img { width: 48px; height: 48px; image-rendering: pixelated;
                 border: 1px solid #333; cursor: pointer; flex: 0 0 auto; }
  #library img:hover { border-color: #7fd; }
  #rules-view { flex: 1; display: none; gap: 10px; }
  #tag-list { width: 200px; overflow-y: auto; }
  #tag-list .tag-row { padding: 4px 6px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  #tag-list .tag-row.active { background: #3a3a55; color: #fff; }
  #rule-panel { flex: 1; overflow-y: auto; }
  #sample-panel { width: 260px; }
  .chip { display: inline-block; background: #254438; padding: 1px 7px; border-radius: 3px;
          margin: 2px; cursor: pointer; }
  .chip.forbid { background: #552222; }
  .chip:hover { text-decoration: line-through; }
  .add-chip { color: #666; cursor: pointer; margin: 2px; display: inline-block; }
  table td { padding: 3px 6px; vertical-align: top; }
  input.small { width: 60px; }
  input.dir { width: 130px; }
  .adj-dir { display: flex; gap: 6px; margin: 3px 0; }
  .adj-dirlabel { flex: 0 0 16px; color: #888; }
  .adj-rows { flex: 1; min-width: 0; }
  .adj-row { display: flex; align-items: center; gap: 6px; margin: 1px 0; }
  .adj-name { flex: 0 0 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adj-bar { height: 9px; background: #3a6; border-radius: 2px; min-width: 1px; }
  .adj-count { flex: 0 0 auto; color: #9a9; }
  .adj-empty { color: #888; font-style: italic; margin: 3px 0; }
  #paint-palette img { width:40px; height:40px; image-rendering:pixelated; border:1px solid #333;
                       cursor:pointer; margin:2px; }
  #paint-palette img.active { border-color:#7fd; }
  #paint-palette .erase { display:block; width:100%; margin-bottom:4px; }
  #paint-canvas { image-rendering:pixelated; border:1px solid #444; }
  #paint-layers button { padding: 3px 2px; min-width: 0; font-size: 11px; }
  #paint-map-picker select { min-width: 0; text-overflow: ellipsis; overflow: hidden; }
</style>
</head>
<body>
  <header>
    <button id="tab-draw" class="active">▣ Draw</button>
    <button id="tab-rules">▦ Rules</button>
    <button id="tab-build">▤ Build</button>
    <span class="label" style="margin: 0 0 0 12px">ruleset</span>
    <select id="ruleset-select"></select>
    <button id="new-ruleset">+ new</button>
    <button id="save-tile" class="save" disabled>💾 Save tile</button>
    <button id="save-rules" class="save" style="display:none">💾 Save rules</button>
  </header>

  <main id="draw-view">
    <div id="toolbar" class="panel">
      <button data-tool="pencil" class="active">✏ pencil</button>
      <button data-tool="eraser">▭ eraser</button>
      <button data-tool="fill">▨ fill</button>
      <button data-tool="picker">⊙ picker</button>
      <hr style="border-color:#333;width:100%">
      <button id="undo">↶ undo</button>
      <button id="redo">↷ redo</button>
      <hr style="border-color:#333;width:100%">
      <button id="wrap-toggle" class="on">⟳ wrap ON</button>
    </div>
    <div id="stage" class="panel">
      <canvas id="pixel-canvas" width="512" height="512"></canvas>
    </div>
    <div id="sidebar" class="panel">
      <div class="grp">Preview</div>
      <div style="display:flex; gap:8px; align-items:flex-end">
        <div style="min-width:52px; text-align:center">
          <canvas id="preview-1x" width="16" height="16"></canvas>
          <div class="cap">1:1</div>
        </div>
        <div style="text-align:center">
          <canvas id="preview-3x" width="96" height="96"></canvas>
          <div class="cap">3×3 seamless</div>
        </div>
      </div>
      <div class="grp">Colour</div>
      <div id="palette"></div>
      <div class="row">
        <span class="rlab">custom</span>
        <input type="color" id="custom-color" value="#5a5a72">
      </div>
      <div class="grp">Tile</div>
      <div class="row">
        <span class="rlab">name</span>
        <input id="tile-name" placeholder="moss_floor_1" style="flex:1; min-width:0">
      </div>
      <div id="tile-name-hint" class="rind" style="font-size:11px; min-height:14px; color:#888"></div>
    </div>
  </main>

  <main id="rules-view">
    <div id="tag-list" class="panel">
      <div class="label">Tags in ruleset</div>
      <div id="tag-rows"></div>
      <div class="add-chip" id="add-tag">+ new tag</div>
    </div>
    <div id="rule-panel" class="panel"></div>
    <div id="sample-panel" class="panel">
      <div class="label">Live sample</div>
      <canvas id="sample-canvas" width="240" height="160"></canvas>
      <button id="reroll" style="margin-top:6px">⟳ re-roll</button>
    </div>
  </main>

  <main id="build-view" style="display:none">
    <div id="paint-palette" class="panel" style="width:170px; overflow-y:auto"></div>
    <div id="paint-stage" class="panel" style="flex:1; display:flex; align-items:center; justify-content:center; overflow:auto">
      <canvas id="paint-canvas"></canvas>
    </div>
    <div id="paint-sidebar" class="panel" style="width:240px; display:flex; flex-direction:column; overflow-y:auto">
      <div class="grp">Map</div>
      <div id="paint-map-picker" style="display:flex; gap:4px; align-items:center; flex-wrap:wrap"></div>
      <div class="row">
        <span class="rlab">size</span>
        <input id="paint-w" class="small" type="number" min="2" max="60" value="16" style="width:44px">
        <span>×</span>
        <input id="paint-h" class="small" type="number" min="2" max="40" value="12" style="width:44px">
        <button id="paint-resize">resize</button>
      </div>
      <div class="row" id="paint-history">
        <span class="rlab">history</span>
        <button id="paint-undo" style="flex:1" disabled>↶ undo</button>
        <button id="paint-redo" style="flex:1" disabled>↷ redo</button>
      </div>

      <div class="grp">Layer</div>
      <div id="paint-layers" style="display:flex; gap:4px">
        <button id="layer-base" class="on" style="flex:1">base</button>
        <button id="layer-overlay" style="flex:1">overlay</button>
        <button id="layer-properties" style="flex:1">props</button>
      </div>
      <div id="prop-controls" style="display:none">
        <div class="row" id="prop-mode">
          <span class="rlab">mode</span>
          <div style="flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:4px">
            <button data-prop="collision" class="on">collision</button>
            <button data-prop="interaction">interact</button>
            <button data-prop="structure">structure</button>
          </div>
        </div>
        <div class="row" id="prop-collision-vals">
          <span class="rlab">value</span>
          <button data-collision="walkable" class="on">walkable</button>
          <button data-collision="wall">wall</button>
        </div>
        <div class="row" id="prop-interaction-vals" style="display:none">
          <span class="rlab">value</span>
          <button data-interaction="door" class="on">door</button>
          <button data-interaction="chest">chest</button>
        </div>
        <div class="row">
          <span class="rlab">export</span>
          <input id="structure-name" placeholder="castle" style="flex:1; min-width:0">
          <input id="structure-depth" class="small" type="number" min="1" max="10"
                 style="width:44px" placeholder="d" title="target depth (1-10)">
          <button id="export-structure" style="background:#664a22; color:#fff" title="Export structure">⛫</button>
        </div>
        <div id="export-report" style="font-size:11px; color:#9a9"></div>
      </div>

      <div class="grp">Rules</div>
      <div id="paint-tagging" class="row"></div>
      <button id="derive-btn" style="background:#2a4a66; color:#fff">⚙ Derive rules</button>
      <div id="derive-report" style="font-size:11px; color:#9a9"></div>

      <div class="grp">Preview</div>
      <canvas id="paint-preview" width="216" height="144"></canvas>
      <button id="paint-reroll" style="margin-top:4px">⟳ re-roll</button>
    </div>
  </main>

  <div id="library-bar" class="panel">
    <div style="display:flex;gap:8px;align-items:center">
      <span class="label" style="margin:0">Library (click = load as base)</span>
      <span id="library-mode"></span>
      <input id="library-filter" placeholder="filter…" style="width:140px">
    </div>
    <div id="library"></div>
  </div>

  <script type="module" src="./editor.js"></script>
</body>
</html>
